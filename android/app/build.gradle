plugins { id 'com.android.application' }
def sfcSource = providers.gradleProperty('wizplayerSnes9xSource').orNull
android {
    namespace 'jp.gbwiz'
    compileSdk 35
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId 'jp.wizplayer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [appLabel: 'WizPlayer']
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments "-DWIZPLAYER_SNES9X_SOURCE=${sfcSource ? file(sfcSource).absolutePath : ''}" } }
    }
    buildTypes {
        debug {
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: 'WizPlayer 開発版']
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '4.1.2' } }
}
